<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healthcare Quality Management Variable Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: instrument panel with three views (Atlas / Model builder / Gap map); index left, canvas centre, ledger right; stacks on phones */
:root{
  --bg:#f5f7f8; --panel:#ffffff; --fg:#14232b; --muted:#5b6d76; --line:#d9e1e5;
  --accent:#0b6e75; --accent-soft:#e1f0f1; --prop:#c06a3a;
  --pos:#0b8a6f; --neg:#c2413a; --ns:#9aa7ad;
  --heat0:#eef3f4; --heat1:#0b6e75;
  --f-body:"Instrument Sans",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e171b; --panel:#15222a; --fg:#e4ecef; --muted:#93a6ae; --line:#26363f;
  --accent:#4cc2c9; --accent-soft:#16343a; --prop:#e59561;
  --pos:#3fcaa4; --neg:#f0776f; --ns:#6b7c84; --heat0:#1a2a32; --heat1:#4cc2c9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171b; --panel:#15222a; --fg:#e4ecef; --muted:#93a6ae; --line:#26363f;
  --accent:#4cc2c9; --accent-soft:#16343a; --prop:#e59561;
  --pos:#3fcaa4; --neg:#f0776f; --ns:#6b7c84; --heat0:#1a2a32; --heat1:#4cc2c9; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:10px}
h1{font:700 1.4rem/1.2 var(--f-body);margin:0;letter-spacing:-.01em;text-wrap:balance}
.meta{color:var(--muted);font:12px var(--f-mono)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button,.lang button{font:600 13px var(--f-body);border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--panel)}
.lang{display:flex;gap:2px;margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--panel)}
.lang button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i,h3 i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-2px}
.mi-iv,.mi-dv,.mi-me,.mi-mo,.mi-cf,.mi-fx{box-shadow:0 1px 2px rgba(0,0,0,.35)}
.mi-iv{background:radial-gradient(circle at 34% 30%,#fff 0 7%,#cfe3ff 16%,#4f7fb8 55%,#13294a 100%)}
.mi-dv{background:radial-gradient(circle at 34% 30%,#fff 0 7%,#fff3c4 16%,#d4a62a 55%,#5e4205 100%)}
.mi-me{background:radial-gradient(circle at 34% 30%,#fff 0 7%,#f0e2ff 16%,#8a5cc4 55%,#2e1650 100%)}
.mi-mo{background:radial-gradient(circle at 34% 30%,#fff 0 7%,#d8ffe9 16%,#3c9e6e 55%,#0f3d26 100%)}
.mi-cf{background:radial-gradient(circle at 34% 30%,#fff 0 7%,#ffffff 16%,#a9b3ba 55%,#3c454b 100%)}
.mi-fx{background:radial-gradient(circle at 34% 30%,#fff 0 7%,#ffe0cc 16%,#c06a3a 55%,#4a1d06 100%)}
.legend .dash{display:inline-block;width:22px;border-top:2px dashed var(--prop);vertical-align:3px;margin-right:5px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 380px;gap:12px;height:calc(100% - 92px);min-height:560px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.side{padding:12px;gap:8px}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,.row:focus-visible,.vitem:focus-visible,td.c:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.list{overflow:auto;flex:1;margin:0 -12px;padding:0 12px}
.vitem{display:flex;justify-content:space-between;gap:8px;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:13px}
.vitem:hover{background:var(--accent-soft)}.vitem.on{background:var(--accent);color:var(--panel)}
.vitem span:last-child{font:12px var(--f-mono);opacity:.7;font-variant-numeric:tabular-nums}
.cy{flex:1;min-height:420px}
.maphead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.maphead h2{font:600 1.1rem var(--f-body);margin:0}
.chip{font:11px var(--f-mono);padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.maphead label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.maphead input[type=range]{width:90px;padding:0}
.btn{font:600 12px var(--f-body);border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:5px 10px;cursor:pointer}
.btn:hover{background:var(--accent-soft)}
.ledger{overflow:auto;padding:12px;gap:14px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.stats div{border:1px solid var(--line);border-radius:6px;padding:5px 2px}
.stats b{display:block;font:600 1.05rem var(--f-mono);font-variant-numeric:tabular-nums}
.stats small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
h3{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.07em;margin:0 0 4px;display:flex;align-items:center;gap:2px}
.sub{font-size:11.5px;color:var(--muted);margin:-2px 0 4px 6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:13px}
.row:hover,.row.on{background:var(--accent-soft)}
.row .n{font:12px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.g{font:600 10.5px var(--f-mono);padding:0 5px;border-radius:4px;border:1px solid currentColor;margin-left:4px}
.gA{color:var(--pos)}.gB{color:var(--accent)}.gC{color:var(--muted)}.gD{color:var(--ns)}
.prop{color:var(--prop)}
.p{color:var(--pos)}.m{color:var(--neg)}.z{color:var(--ns)}
.empty{color:var(--muted);font-size:12px;padding:2px 6px}
.papers{border-top:1px solid var(--line);padding-top:10px}
.paper{padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.paper a{color:var(--accent);text-decoration:none;font-weight:500}.paper a:hover{text-decoration:underline}
.paper .pm{font:11px var(--f-mono);color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);line-height:1.45}
.modeltxt{font-size:13px;line-height:1.55;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg)}
.gapwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;height:calc(100% - 92px);min-height:560px}
.heat{overflow:auto;padding:12px}
.heat table{border-collapse:separate;border-spacing:3px;font-size:12px}
.heat th{font-weight:600;color:var(--muted);text-align:left;padding:2px 6px;white-space:nowrap}
.heat thead th{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;height:190px;vertical-align:bottom}
.heat table{width:100%}
td.c{min-width:40px;height:38px;text-align:center;font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;border-radius:5px;cursor:pointer}
td.c.on{outline:2px solid var(--prop);outline-offset:1px}
td.c.zero{background:repeating-linear-gradient(135deg,var(--line) 0 1.5px,transparent 1.5px 7px)!important;color:var(--muted)!important}
td.tot,th.tot{font:600 12px var(--f-mono);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.gaphead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.hlegend{display:flex;gap:6px 16px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.hlegend span{display:inline-flex;align-items:center;gap:6px}
.hlegend .ramp{width:120px;height:10px;border-radius:3px;background:linear-gradient(90deg,var(--heat0),var(--heat1))}
.hlegend .hz{width:18px;height:12px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--line) 0 1.5px,transparent 1.5px 7px);border:1px solid var(--line)}
/* overview */
.over{height:calc(100% - 60px);overflow:auto;padding-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font:600 1.45rem/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:11.5px}
.ogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{padding:14px 16px;gap:6px;overflow:visible}
.card.wide{grid-column:1/-1}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.chead h3{margin:0}
.tools{display:flex;gap:4px;align-items:center;margin-left:auto}
.maphead .tools{margin-left:auto}
.btn.sm{padding:3px 8px;font-size:11.5px;min-width:28px}
a.btn{text-decoration:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{font:600 11.5px var(--f-body);border:0;background:transparent;color:var(--muted);padding:3px 8px;border-radius:4px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.chart svg{display:block;width:100%;height:auto}
.chart g.hit:hover .bar{opacity:.72}
.chart .band{transition:opacity .12s}
.chart.hl .band{opacity:.12}.chart.hl .band.on{opacity:.75}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--fg);color:var(--panel);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:6px;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.prisma{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.pstep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.pbox{border:1px solid var(--accent);border-radius:6px;padding:6px 10px;background:var(--accent-soft)}
.pbox b,.pex b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pex{border:1px dashed var(--line);border-radius:6px;padding:4px 10px;color:var(--muted);font-size:11.5px;line-height:1.5}
.parrow{color:var(--muted);padding-left:18px;line-height:1;font-size:13px}
.mini{margin-top:4px}
@media (max-width:1100px){.app{grid-template-columns:220px minmax(0,1fr);height:auto}.app>.box:not(.ledger){height:min(78vh,640px)}.ledger{grid-column:1/-1;max-height:none}.gapwrap{grid-template-columns:1fr;height:auto}}
#sankey{overflow-x:auto}
@media (max-width:900px){.ogrid{grid-template-columns:minmax(0,1fr)}.over{height:auto}#sankey svg{min-width:760px}.meta{overflow-wrap:anywhere;min-width:0}.tabs{flex-wrap:wrap}}
@media (max-width:700px){.app,.gapwrap{display:flex;flex-direction:column;height:auto}.side{max-height:260px}.cy{height:460px;flex:none}.lang{margin-left:0}}
</style>

<header>
  <h1 data-i18n="title">Healthcare Quality Management Variable Atlas</h1>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-over" data-view="over" data-i18n="tabOver">Overview</button>
    <button role="tab" id="tab-atlas" data-view="atlas" data-i18n="tabAtlas">Atlas</button>
    <button role="tab" id="tab-model" data-view="model" data-i18n="tabModel">Model builder</button>
    <button role="tab" id="tab-gaps" data-view="gaps" data-i18n="tabGaps">Gap map</button>
  </div>
  <span class="meta" id="meta">loading…</span>
  <a class="btn sm" id="xlsx" hidden download data-i18n="dlData">Data (Excel)</a>
  <div class="lang" aria-label="Language"><button id="l-en" data-lang="en" aria-pressed="true">EN</button><button id="l-tr" data-lang="tr" aria-pressed="false">TR</button></div>
</header>
<div class="legend">
  <span><i class="mi-iv"></i><span data-i18n="lgIV">predictor (IV)</span></span><span><i class="mi-dv"></i><span data-i18n="lgDV">outcome (DV)</span></span>
  <span><i class="mi-me"></i><span data-i18n="lgMe">mediator</span></span><span><i class="mi-mo"></i><span data-i18n="lgMo">moderator</span></span>
  <span><i class="mi-fx"></i><span data-i18n="lgSel">selected</span></span>
  <span><i style="background:var(--pos)"></i>+</span><span><i style="background:var(--neg)"></i>−</span>
  <span><span class="dash"></span><span data-i18n="lgProp">proposed, not yet tested</span></span>
</div>

<!-- VIEW 0: overview -->
<div class="over" id="v-over" hidden>
  <div class="kpis" id="kpis"></div>
  <div class="ogrid">
    <section class="box card wide"><div class="chead"><h3 data-i18n="sankeyT"></h3><div class="tools" data-exp="sankey"></div></div>
      <div class="note" data-i18n="sankeyN"></div><div class="chart" id="sankey"></div></section>
    <section class="box card"><div class="chead"><h3 data-i18n="topT"></h3><div class="tools" data-exp="topvars"></div></div>
      <div class="seg" id="topmode"></div><div class="note" data-i18n="topN"></div><div class="chart" id="topvars"></div></section>
    <section class="box card"><div class="chead"><h3 data-i18n="yearT"></h3><div class="tools" data-exp="years"></div></div>
      <div class="note" id="yearN"></div><div class="chart" id="years"></div>
      <div class="chead" style="margin-top:14px"><h3 data-i18n="prT"></h3></div><div class="note" data-i18n="prN"></div><div class="prisma" id="prisma"></div></section>
    <section class="box card"><div class="chead"><h3 data-i18n="desT"></h3><div class="tools" data-exp="designs"></div></div><div class="chart" id="designs"></div>
      <div class="chead" style="margin-top:14px"><h3 data-i18n="metT"></h3><div class="tools" data-exp="methods"></div></div><div class="chart" id="methods"></div></section>
    <section class="box card"><div class="chead"><h3 data-i18n="ctyT"></h3><div class="tools" data-exp="countries"></div></div>
      <div class="note" id="ctyN"></div><div class="chart" id="countries"></div></section>
  </div>
</div>
<div id="tip" role="tooltip" hidden></div>

<!-- VIEW 1: atlas -->
<div class="app" id="v-atlas">
  <aside class="box side">
    <input id="q" type="search" aria-label="Search variables">
    <select id="cat" aria-label="Category"></select>
    <div class="list" id="vlist" role="listbox"></div>
  </aside>
  <section class="box">
    <div class="maphead">
      <h2 id="focus">—</h2><span class="chip" id="fcat"></span>
      <label for="mink"><span data-i18n="minStudies">min. studies</span> <input id="mink" type="range" min="1" max="5" value="1"><span id="minkv" class="meta">1</span></label>
      <label for="cap"><span data-i18n="maxSide">max per side</span> <input id="cap" type="range" min="5" max="30" value="14"><span id="capv" class="meta">14</span></label>
      <button class="btn" id="toModel" data-i18n="buildModel">Build a model for this outcome →</button>
      <div class="tools"><button class="btn sm" data-z="out" data-i18n-title="zoomOut">−</button><button class="btn sm" data-z="in" data-i18n-title="zoomIn">+</button><button class="btn sm" data-z="fit" data-i18n="fit">Fit</button>
        <button class="btn sm" id="pngA" data-i18n-title="pngTip">PNG</button><button class="btn sm" id="csvA" data-i18n-title="csvTip">CSV</button></div>
    </div>
    <div id="cy" class="cy"></div>
  </section>
  <aside class="box ledger" id="ledger"></aside>
</div>

<!-- VIEW 2: model builder -->
<div class="app" id="v-model" hidden>
  <aside class="box side">
    <div class="note" data-i18n="pickDV">Pick the outcome (dependent variable) of your study.</div>
    <input id="q2" type="search" aria-label="Search outcomes">
    <div class="list" id="dvlist" role="listbox"></div>
  </aside>
  <section class="box">
    <div class="maphead"><h2 id="mfocus">—</h2><span class="chip" id="mcat"></span>
      <button class="btn" id="copyModel" data-i18n="copy">Copy model text</button><span class="meta" id="copied"></span>
      <div class="tools"><button class="btn sm" id="pngM" data-i18n-title="pngTip">PNG</button></div></div>
    <div id="cy2" class="cy"></div>
    <div style="padding:10px 12px;border-top:1px solid var(--line)"><div class="modeltxt" id="modeltxt"></div></div>
  </section>
  <aside class="box ledger" id="mledger"></aside>
</div>

<!-- VIEW 3: gap map -->
<div class="gapwrap" id="v-gaps" hidden>
  <section class="box heat"><div class="note" data-i18n="gapIntro" style="margin-bottom:8px"></div>
    <div class="gaphead"><div class="seg" id="gmode"></div><div class="tools"><button class="btn sm" id="csvG" data-i18n-title="csvGTip">CSV</button></div></div>
    <div id="heat"></div>
    <div class="hlegend"><span><span data-i18n="hlFew"></span><span class="ramp"></span><span data-i18n="hlMany"></span></span><span><span class="hz"></span><span data-i18n="hlZero"></span></span></div></section>
  <aside class="box ledger" id="gledger"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>
const I18N = {
 en: { title: "Healthcare Quality Management Variable Atlas", tabAtlas: "Atlas", tabModel: "Model builder", tabGaps: "Gap map",

/* ---------- GAP MAP ---------- */
let GAP = null, gsel = null, GMODE = "st";

    const a = byName[e.s]?.c, b = byName[e.t]?.c; if (!a || !b) return;
    const c = (cells[a + "|" + b] ||= { rids: new Set(), edges: [], me: 0, mo: 0 });
    e.r.forEach(r => { c.rids.add(r); (row[a] ||= new Set()).add(r); (col[b] ||= new Set()).add(r); all.add(r); }); c.edges.push(e);

}

/* ---------- shared helpers: tooltip, downloads ---------- */
function yearOf(p) { return +(p[0].match(/\((\d{4})\)/)?.[1] || 0); }
function tipOn(html, ev) {

function exportChart(id, png) {

  const bg = document.createElementNS(ns, "rect");

    const g = cv.getContext("2d"); g.scale(3, 3); g.drawImage(img, 0, 0, vb.width, vb.height); cv.toBlob(b => dl(b, name + ".png")); };

/* ---------- chart primitives (inline SVG, colours resolved from tokens so exports are self-contained) ---------- */

  const C = colors(), lw = opt.lw || 210, W = 620, rh = 24, H = rows.length * rh + 4, max = Math.max(1, ...rows.map(r => r.v)), bw = W - lw - 52;

    s += `<g class="hit" data-i="${i}" data-tip="${esc(r.tip || "")}"><rect x="0" y="${y}" width="${W}" height="${rh}" fill="transparent"/>
      <text x="${lw - 10}" y="${y + rh / 2 + 4}" text-anchor="end" fill="${C.fg}">${esc(lab)}</text>
      <rect class="bar" x="${lw}" y="${y + 5}" width="${w}" height="${rh - 10}" rx="3" fill="${C.accent}"/>
      <text x="${lw + w + 6}" y="${y + rh / 2 + 4}" fill="${C.muted}" ${MONO} font-size="11.5">${r.v}</text></g>`;

function niceStep(v) { return [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(s => v / s <= 4) || 2000; }
function cols(el, counts, opt = {}) {
  const C = colors(), ys = Object.keys(counts).map(Number).filter(Boolean);
  if (!ys.length) { el.innerHTML = `<div class="empty">${esc(t("none"))}</div>`; return; }
  const y0 = Math.min(...ys), y1 = Math.max(...ys), data = [];
  for (let y = y0; y <= y1; y++) data.push([y, counts[y] || 0]);
  const mini = opt.mini, W = mini ? 340 : 620, H = mini ? 74 : 230, ml = mini ? 2 : 36, mr = 4, mt = 8, mb = 20, iw = W - ml - mr, ih = H - mt - mb;
  const vmax = Math.max(1, ...data.map(d => d[1])), step = niceStep(vmax), top = mini ? vmax : Math.ceil(vmax / step) * step;
  const bw = iw / data.length, built = +(String(D.meta.built || "").slice(0, 4)) || 9999;
  let s = `<svg viewBox="0 0 ${W} ${H}" ${FONT} font-size="11" role="img">`;
  if (!mini) for (let v = 0; v <= top; v += step) { const y = mt + ih - v / top * ih;
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}" stroke="${C.line}" stroke-width="1"/><text x="${ml - 6}" y="${y + 4}" text-anchor="end" fill="${C.muted}" ${MONO} font-size="10.5">${v}</text>`; }
  data.forEach(([y, v], i) => {

    s += `<g class="hit" data-tip="${esc(tip)}"><rect x="${x}" y="${mt}" width="${bw}" height="${ih}" fill="transparent"/>`;
    if (v) s += `<rect class="bar" x="${x + Math.min(1, bw * .15)}" y="${mt + ih - h}" width="${Math.max(1, bw - Math.min(2, bw * .3))}" height="${h}" rx="${Math.min(3, bw / 4)}" fill="${C.accent}" opacity="${part ? .4 : 1}"/>`;
    s += `</g>`;
    if (y === y0 || y === y1 || (!mini && y % 5 === 0 && y - y0 > 2 && y1 - y > 2))
      s += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle" fill="${C.muted}" ${MONO} font-size="10.5">${y}</text>`;
  });
  s += `<line x1="${ml}" x2="${W - mr}" y1="${mt + ih}" y2="${mt + ih}" stroke="${C.muted}" stroke-width="1"/>`;
  el.innerHTML = s + `</svg>`; bindTips(el);
}
function sankey(el) {
  const C = colors(), G = gapData(), cats = CAT_ORDER.filter(c => c !== "Other");
  const val = (a, b) => G.cells[a + "|" + b]?.rids.size || 0;
  const L = cats.map(a => [a, cats.reduce((s, b) => s + val(a, b), 0)]).filter(x => x[1]);
  const R = cats.map(b => [b, cats.reduce((s, a) => s + val(a, b), 0)]).filter(x => x[1]);
  const total = L.reduce((s, x) => s + x[1], 0); if (!total) { el.innerHTML = ""; return; }

  const pos = (list) => { let y = 0; const o = {}; list.forEach(([c, v]) => { const h = v * sc; o[c] = { y: y + Math.max(0, (minSlot - h) / 2), h, used: 0, v }; y += Math.max(h, minSlot) + gap; }); o.H = y - gap; return o; };

    const xa = x1 + nw, xm = (xa + x2) / 2;

    const tip = `${esc(catL(a))} → ${esc(catL(b))}<br><b>${esc(t("nStudies")(v))}</b>`;

  }));
  // R positions were consumed in a-major order; that keeps each source's bands contiguous on the left
  let nodes = "";
  L.forEach(([a, v]) => { const p = PL[a];
    nodes += `<g class="nd" data-a="${esc(a)}"><rect x="${x1}" y="${p.y}" width="${nw}" height="${Math.max(2, p.h)}" rx="2" fill="${C.fg}"/>
      <text x="${x1 - 10}" y="${p.y + p.h / 2 + 4}" text-anchor="end" fill="${C.fg}" font-size="13">${esc(catL(a))} <tspan fill="${C.muted}" ${MONO} font-size="11.5">${G.row[a]?.size || 0}</tspan></text></g>`; });
  R.forEach(([b, v]) => { const p = PR[b];
    nodes += `<g class="nd" data-b="${esc(b)}"><rect x="${x2}" y="${p.y}" width="${nw}" height="${Math.max(2, p.h)}" rx="2" fill="${C.fg}"/>
      <text x="${x2 + nw + 10}" y="${p.y + p.h / 2 + 4}" fill="${C.fg}" font-size="13">${esc(catL(b))} <tspan fill="${C.muted}" ${MONO} font-size="11.5">${G.col[b]?.size || 0}</tspan></text></g>`; });
  const hdr = `<text x="${x1 + nw}" y="-12" text-anchor="end" fill="${C.muted}" font-size="11.5" font-weight="600" letter-spacing=".06em">${esc(t("ivCat").toUpperCase())}</text>
    <text x="${x2}" y="-12" fill="${C.muted}" font-size="11.5" font-weight="600" letter-spacing=".06em">${esc(t("dvCat").toUpperCase())}</text>`;
  el.innerHTML = `<svg viewBox="0 -30 ${W} ${H + 40}" ${FONT} role="img" aria-label="${esc(t("sankeyT"))}">${hdr}${bands}${nodes}</svg>`;
  bindTips(el);
  const hl = (pred) => { el.classList.add("hl"); el.querySelectorAll(".band").forEach(p => p.classList.toggle("on", pred(p))); };
  const off = () => { el.classList.remove("hl"); el.querySelectorAll(".band.on").forEach(p => p.classList.remove("on")); };
  el.querySelectorAll(".band").forEach(p => {

    p.style.cursor = "pointer"; p.onclick = () => { tipOff(); gsel = p.dataset.a + "|" + p.dataset.b; GMODE = "st"; location.hash = "gaps"; };
  });
  el.querySelectorAll(".nd").forEach(g => {
    const a = g.dataset.a, b = g.dataset.b;
    g.addEventListener("mouseenter", () => hl(q => a ? q.dataset.a === a : q.dataset.b === b)); g.addEventListener("mouseleave", off);

}

  hbar($("#countries"), Object.entries(O.ctry).sort((a, b) => b[1] - a[1]).slice(0, 15).map(([c, v]) => ({ label: c, v, tip: `<b>${esc(c)}</b><br>${esc(t("nStudies")(v))}` })), { lw: 150, label: t("ctyT") });
  renderPrisma();
}
function renderPrisma() {
  const P = D.meta.prisma; if (!P) { $("#prisma").closest(".card").querySelectorAll("#prisma, [data-i18n='prT'], [data-i18n='prN']").forEach(x => x.hidden = true); return; }
  const tr = s => t("PR")[s] || I18N.en.PR[s] || s;
  const exl = s => { if (/^Duplicates/.test(s)) return tr(s); const c = s.replace(/^Excluded:\s*/, ""), code = (c.match(/^([EX]\d)/) || [])[1]; return (code ? t("EX")[code] : t("EX")[c]) || c; };
  const steps = []; P.forEach(([s, n]) => { if (/^(Excluded|Duplicates)/.test(s)) { if (steps.length) steps[steps.length - 1].ex.push([exl(s), n]); } else steps.push({ s, n, ex: [] }); });
  const f = n => Number(n).toLocaleString(LANG === "tr" ? "tr-TR" : "en-US");
  $("#prisma").innerHTML = steps.map((st, i) => `${i ? `<div class="parrow">↓</div>` : ""}<div class="pstep"><div class="pbox">${esc(tr(st.s))}: <b>${f(st.n)}</b></div>
    ${st.ex.length ? `<div class="pex">${esc(t("excluded"))}: <b>${f(st.ex.reduce((a, x) => a + x[1], 0))}</b><br>${st.ex.map(([l, n]) => `${esc(l)} <b>${f(n)}</b>`).join("<br>")}</div>` : "<div></div>"}</div>`).join("");
}
